name: Build CorePatch N — Restricted Settings (API 37)

on:
  push:
    branches:
      - 'feature/**'
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release/debug/both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. JDK 21 (required by AGP 9.x + compileSdk 37)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Gradle Wrapper cache
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # 4. Write signing key (main branch only, if secrets exist)
      - name: Write signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo releaseStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo releaseKeyAlias='${{ secrets.ALIAS }}'                   >> gradle.properties
            echo releaseKeyPassword='${{ secrets.KEY_PASSWORD }}'         >> gradle.properties
            echo releaseStoreFile='key.jks'                               >> gradle.properties
            echo "$SIGNING_KEY" | base64 --decode > key.jks
            echo "Signing key written."
          else
            echo "No signing secrets configured, skipping."
          fi

      # 5. Print build info
      - name: Build info
        run: |
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          echo "Trigger: ${{ github.event_name }}"
          java -version
          ./gradlew --version

      # 6. Build Release APK
      - name: Build Release APK
        if: github.event.inputs.build_type != 'debug'
        run: ./gradlew assembleRelease --stacktrace

      # 7. Build Debug APK
      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: ./gradlew assembleDebug --stacktrace

      # 8. Rename APKs with branch + sha
      - name: Rename APK artifacts
        if: success()
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_DIR="app/build/outputs/apk"
          find "$APK_DIR" -name "*.apk" | while read apk; do
            DIR=$(dirname "$apk")
            BASE=$(basename "$apk" .apk)
            mv "$apk" "$DIR/${BASE}-${BRANCH}-${SHORT_SHA}.apk"
            echo "Renamed: ${BASE}-${BRANCH}-${SHORT_SHA}.apk"
          done
          echo "=== Final APK list ==="
          find "$APK_DIR" -name "*.apk" -exec ls -lh {} \;

      # 9. Upload artifacts
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CorePatchN-RestrictedSettings-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      # 10. Step Summary
      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$(echo ${{ github.sha }} | cut -c1-7)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### New Feature: RestrictedSettingsHook" >> $GITHUB_STEP_SUMMARY
          echo "- AppOpsService hook (Android 13-14 / API 33-34)" >> $GITHUB_STEP_SUMMARY
          echo "- EnhancedConfirmationManager hook (Android 15-17 / API 35-37)" >> $GITHUB_STEP_SUMMARY
          echo "- Tested on: PixelOS 17.0 / Poco F3 / Vector Xposed" >> $GITHUB_STEP_SUMMARY
