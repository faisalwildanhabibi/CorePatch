name: Build CorePatch N — Restricted Settings (API 37)

on:
  push:
    branches:
      - 'feature/**'
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'both'
        type: choice
        options:
          - release
          - debug
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. JDK 21 (required by AGP 9.x) ──────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # ── 3. Gradle cache ───────────────────────────────────────
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Signing key (hanya untuk push ke main) ─────────────
      - name: Write signing key
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          secrets.SIGNING_KEY != ''
        run: |
          echo releaseStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo releaseKeyAlias='${{ secrets.ALIAS }}'                   >> gradle.properties
          echo releaseKeyPassword='${{ secrets.KEY_PASSWORD }}'         >> gradle.properties
          echo releaseStoreFile='key.jks'                               >> gradle.properties
          echo '${{ secrets.SIGNING_KEY }}' | base64 --decode > key.jks
          echo "Signing key written."

      # ── 5. Build info ─────────────────────────────────────────
      - name: Build info
        run: |
          echo "Branch   : ${{ github.ref_name }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Trigger  : ${{ github.event_name }}"
          java -version
          ./gradlew --version

      # ── 6. Build Release APK ──────────────────────────────────
      - name: Build Release APK
        if: >
          github.event.inputs.build_type == 'release' ||
          github.event.inputs.build_type == 'both' ||
          github.event.inputs.build_type == ''
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.experimental.suppressExtractNativeLibsWarning=true

      # ── 7. Build Debug APK ────────────────────────────────────
      - name: Build Debug APK
        if: >
          github.event.inputs.build_type == 'debug' ||
          github.event.inputs.build_type == 'both' ||
          github.event.inputs.build_type == ''
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ── 8. Rename APKs with branch + sha ─────────────────────
      - name: Rename APK artifacts
        if: success()
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_DIR="app/build/outputs/apk"

          find "$APK_DIR" -name "*.apk" | while read apk; do
            DIR=$(dirname "$apk")
            BASENAME=$(basename "$apk" .apk)
            mv "$apk" "$DIR/${BASENAME}-${BRANCH}-${SHORT_SHA}.apk"
          done

          echo "=== APK files ==="
          find "$APK_DIR" -name "*.apk" -exec ls -lh {} \;

      # ── 9. Upload artifacts ───────────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CorePatchN-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      # ── 10. Build summary ────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### New Features in This Build" >> $GITHUB_STEP_SUMMARY
          echo "- \`RestrictedSettingsHook\` — Bypass Android Restricted Settings (API 33–37)" >> $GITHUB_STEP_SUMMARY
          echo "- AppOpsService hook (Android 13–14)" >> $GITHUB_STEP_SUMMARY
          echo "- EnhancedConfirmationManager hook (Android 15–17)" >> $GITHUB_STEP_SUMMARY
          echo "- Compatible with **Vector** (JingMatrix) Xposed framework" >> $GITHUB_STEP_SUMMARY
