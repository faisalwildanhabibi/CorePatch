name: Build ZygiskCore

on:
  push:
    branches:
      - ZygiskCore
  pull_request:
    branches:
      - ZygiskCore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Zygisk Module ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-zygisk-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-zygisk-${{ runner.os }}-

      - name: Build info
        run: |
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          java -version
          ./gradlew --version

      - name: Build ZygiskCore (Release + Debug)
        run: |
          ./gradlew :zygisk:assembleFullRelease :zygisk:assembleFullDebug \
            --no-configuration-cache \
            --stacktrace

      - name: Find built artifacts
        if: success()
        run: |
          echo "=== Zygisk build outputs ==="
          find zygisk/build/outputs -type f | sort
          echo "=== File sizes ==="
          find zygisk/build/outputs \( -name '*.zip' -o -name '*.apk' \) -exec ls -lh {} \;

      - name: Rename artifacts with branch + SHA
        if: success()
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          find zygisk/build/outputs \( -name '*.zip' -o -name '*.apk' \) | while read f; do
            DIR=$(dirname "$f")
            EXT="${f##*.}"
            BASE=$(basename "$f" ".${EXT}")
            NEWNAME="$DIR/${BASE}-${BRANCH}-${SHORT_SHA}.${EXT}"
            mv "$f" "$NEWNAME"
            echo "Renamed: $(basename $NEWNAME)"
          done

      - name: Upload ZygiskCore artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZygiskCore-${{ github.sha }}
          path: |
            zygisk/build/outputs/**/*.zip
            zygisk/build/outputs/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          echo "## ZygiskCore Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$(echo ${{ github.sha }} | cut -c1-7)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Features" >> $GITHUB_STEP_SUMMARY
          echo "- No Xposed/LSPosed required" >> $GITHUB_STEP_SUMMARY
          echo "- Works with Zygisk Next + ReSukiSu" >> $GITHUB_STEP_SUMMARY
          echo "- 13 CorePatch N hooks + Restricted Settings bypass" >> $GITHUB_STEP_SUMMARY
          echo "- Android 8.1–17 (API 28–37) support" >> $GITHUB_STEP_SUMMARY
