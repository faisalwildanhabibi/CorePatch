name: Build ZygiskCore

on:
  push:
    branches:
      - ZygiskCore
  pull_request:
    branches:
      - ZygiskCore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Zygisk Module ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-zygisk-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-zygisk-${{ runner.os }}-

      - name: Prewarm JitPack dependencies
        run: |
          echo "=== Prewarming JitPack artifacts ==="
          # Trigger JitPack build for all required artifacts (transitive included)
          JITPACK="https://jitpack.io"
          # ZygoteLoader plugin
          curl -sf --retry 5 --retry-delay 10 \
            "$JITPACK/com/github/vova7878/ZygoteLoader/358a146d87/build.log" || true
          # AndroidVMTools
          curl -sf --retry 5 --retry-delay 10 \
            "$JITPACK/com/github/vova7878/AndroidVMTools/118f566096/build.log" || true
          # R8Annotations
          curl -sf --retry 5 --retry-delay 10 \
            "$JITPACK/com/github/vova7878/R8Annotations/v0.0.3/build.log" || true
          # DexFile (transitive dependency of AndroidVMTools)
          curl -sf --retry 5 --retry-delay 10 \
            "$JITPACK/com/github/vova7878/DexFile/v1.0.3/build.log" || true
          echo "=== Waiting for JitPack builds ==="
          sleep 15
          # Verify artifacts are available
          for URL in \
            "$JITPACK/com/github/vova7878/ZygoteLoader/358a146d87/ZygoteLoader-358a146d87.pom" \
            "$JITPACK/com/github/vova7878/AndroidVMTools/118f566096/AndroidVMTools-118f566096.pom" \
            "$JITPACK/com/github/vova7878/DexFile/v1.0.3/DexFile-v1.0.3.pom"; do
            if curl -sf "$URL" > /dev/null; then
              echo "OK: $URL"
            else
              echo "WARN: Not yet available: $URL"
            fi
          done

      - name: Build info
        run: |
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          java -version
          ./gradlew --version

      - name: Build ZygiskCore Release
        run: ./gradlew :zygisk:assembleFullRelease --stacktrace --info 2>&1 | tail -200

      - name: Build ZygiskCore Debug
        run: ./gradlew :zygisk:assembleFullDebug --stacktrace

      - name: Find built artifacts
        if: success()
        run: |
          echo "=== Zygisk build outputs ==="
          find zygisk/build/outputs -type f | sort
          echo "=== File sizes ==="
          find zygisk/build/outputs \( -name '*.zip' -o -name '*.apk' \) -exec ls -lh {} \;

      - name: Rename artifacts with branch + SHA
        if: success()
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          find zygisk/build/outputs \( -name '*.zip' -o -name '*.apk' \) | while read f; do
            DIR=$(dirname "$f")
            EXT="${f##*.}"
            BASE=$(basename "$f" ".${EXT}")
            mv "$f" "$DIR/${BASE}-${BRANCH}-${SHORT_SHA}.${EXT}"
            echo "Renamed: $(basename $DIR/${BASE}-${BRANCH}-${SHORT_SHA}.${EXT})"
          done

      - name: Upload ZygiskCore artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZygiskCore-${{ github.sha }}
          path: |
            zygisk/build/outputs/**/*.zip
            zygisk/build/outputs/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          echo "## ZygiskCore Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$(echo ${{ github.sha }} | cut -c1-7)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
